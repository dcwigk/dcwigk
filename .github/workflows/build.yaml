name: README build
on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: readme-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    # a repo added or removed anywhere flushes the LOC cache; the resulting
    # full recrawl takes ~25-30 minutes and must fit inside this limit
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Update profile SVGs
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: dcwigk
        run: uv run today.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cache dark_mode.svg light_mode.svg
          git commit -m "chore: update profile stats" || echo "No changes to commit"
          git push
